<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Contact | BrightPath Studio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header><strong>BrightPath Studio</strong><button id="menuButton" class="menu-button" aria-expanded="false"
            aria-controls="menu">☰ <span class="sr">Menu</span></button>
        <nav id="menu"><a href="index.html">Home</a><a href="about.html">About</a><a href="services.html">Services</a><a
                href="contact.html">Contact</a></nav>
    </header>
    <main>
        <section class="card">
            <h1>Contact Us</h1>
            <p class="muted">This is a demonstration form; messages are not sent.</p>
            <form id="contactForm" novalidate><label for="name">Name</label><input id="name" required><label
                    for="email">Email</label><input id="email" type="email" required><label
                    for="message">Message</label><textarea id="message" rows="5" required></textarea><button
                    type="submit">Check Message</button>
                <p id="status" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>
    <footer>BrightPath Studio • Demonstration</footer>
    <script src="script.js" defer></script>
</body>

</html>
